<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MB Emprende - Productos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>MB Emprende</header>
  <main>
    <h1>Bienvenido a nuestra tienda</h1>
    <div id="productos" class="productos"></div>
  </main>
  <footer>© 2025 MB Emprende</footer>
  <script>
    async function cargarProductos() {
      try {
        const response = await fetch("/productos");
        if (!response.ok) {
          throw new Error("Error al cargar productos");
        }
        const data = await response.json();
        const productosDiv = document.getElementById("productos");
        if (data.data && data.data.products && data.data.products.edges.length > 0) {
          productosDiv.innerHTML = data.data.products.edges.map(edge => `
            <div class="producto">
              <h2>${edge.node.title}</h2>
              <img src="${edge.node.images.edges[0].node.url}" alt="${edge.node.title}" />
              <p>${edge.node.description}</p>
              <p>Precio: $${edge.node.variants.edges[0].node.price.amount}</p>
            </div>
          `).join('');
        } else {
          productosDiv.innerHTML = "<p>No se encontraron productos.</p>";
        }
      } catch (error) {
        console.error("Error al cargar productos:", error);
        document.getElementById("productos").innerHTML = "<p>Error al cargar productos. Intenta de nuevo más tarde.</p>";
      }
    }

    cargarProductos();
  </script>
</body>
</html>
